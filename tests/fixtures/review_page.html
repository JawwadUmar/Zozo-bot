<!DOCTYPE html>
<html>
<head><title>Review Application</title></head>
<body>
  <div role="dialog" aria-modal="true" class="artdeco-modal jobs-easy-apply-modal">
    <div class="artdeco-modal__header">
      <h2>Review your application</h2>
    </div>
    <div class="artdeco-modal__content">
      <p>Review contact info and answers...</p>
      <div>
        <input type="checkbox" id="follow-company-checkbox" checked />
        <label for="follow-company-checkbox">Follow Company to stay up to date with their page.</label>
      </div>
    </div>
    <div class="artdeco-modal__action-bar">
      <button type="button" aria-label="Submit application">Submit application</button>
    </div>
  </div>
</body>
</html>
